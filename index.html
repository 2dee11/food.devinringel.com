<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can't Decide Where to Eat?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Can't Decide Where to Eat? Me either.</h1>
    <p class="subtitle">This is a list of my favorite spots to eat and drink. Hopefully it helps!</p>
  </header>

  <main>
    <section class="pick-section">
      <button id="pick-btn" type="button">🎲 Pick For Me</button>
      <div id="pick-result" class="pick-result" hidden></div>
    </section>

    <section class="filters" aria-label="Filters">
      <div class="filter-group">
        <label id="cuisine-filter-label">Cuisine</label>
        <div class="multiselect" id="cuisine-multiselect">
          <button type="button" class="multiselect-toggle" id="cuisine-toggle"
                  aria-haspopup="listbox" aria-expanded="false" aria-labelledby="cuisine-filter-label">
            All cuisines
          </button>
          <div class="multiselect-panel" id="cuisine-panel" role="listbox" aria-multiselectable="true" hidden></div>
        </div>
      </div>

      <div class="filter-group">
        <label for="location-filter">Location</label>
        <select id="location-filter">
          <option value="">All</option>
          <option value="in-town">In town</option>
          <option value="out-of-town">Out of town</option>
        </select>
      </div>

      <div class="filter-group checkbox-group">
        <label>
          <input type="checkbox" id="open-today-filter" checked>
          Open today
        </label>
      </div>

      <div class="filter-group checkbox-group">
        <label>
          <input type="checkbox" id="food-filter">
          Serves food
        </label>
        <label>
          <input type="checkbox" id="alcohol-filter">
          Serves alcohol
        </label>
      </div>
    </section>

    <p id="status-line" class="status-line"></p>

    <section id="restaurant-list" class="restaurant-list" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
